<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #03070d;
      --panel: rgba(8, 16, 28, 0.65);
      --panel-border: rgba(0, 243, 255, 0.15);
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.35);
      --text: #e0f7fc;
      --text-muted: #5c7f93;
      --danger: #ff3355;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: #000;
      background-image: radial-gradient(circle at 50% 30%, #081a2e 0%, #020509 80%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background: var(--bg);
      border-radius: 36px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.08), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 24px 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.06);
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .status-pill {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--cyan);
      background: rgba(0, 243, 255, 0.06);
      border: 1px solid rgba(0, 243, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s infinite alternate;
    }

    @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      overflow: hidden;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .core-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .jarvis-core-wrap {
      width: 170px;
      height: 170px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border-top-color: var(--cyan);
      border-bottom-color: rgba(0, 243, 255, 0.15);
      border-left-color: rgba(0, 243, 255, 0.15);
      border-right-color: var(--cyan);
      animation: rotateRing 12s linear infinite;
    }

    .ring-mid {
      width: 70%;
      height: 70%;
      border: 1px dashed rgba(0, 243, 255, 0.4);
      animation: rotateRingRev 8s linear infinite;
    }

    .ring-inner {
      width: 40%;
      height: 40%;
      background: radial-gradient(circle, var(--cyan) 0%, rgba(0, 243, 255, 0.1) 70%);
      border-radius: 50%;
      box-shadow: 0 0 25px var(--cyan-glow);
      transition: transform 0.2s ease;
    }

    .jarvis-core-wrap.speaking .ring-inner {
      transform: scale(1.35);
      box-shadow: 0 0 45px var(--cyan), inset 0 0 15px #fff;
    }

    @keyframes rotateRing { 100% { transform: rotate(360deg); } }
    @keyframes rotateRingRev { 100% { transform: rotate(-360deg); } }

    .subtitle-box {
      margin-top: 25px;
      width: 100%;
      min-height: 54px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .btn-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-card label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: var(--cyan);
      cursor: pointer;
    }

    .btn-card span { font-size: 0.7rem; color: var(--text-muted); }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-back {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--cyan);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .chat-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .msg.bot {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      align-self: flex-start;
    }

    .msg.user {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.25);
      color: var(--cyan);
      align-self: flex-end;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 6px 6px 6px 16px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.85rem;
    }

    .input-bar button {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
    }

    .user-video-feed {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 90px;
      height: 120px;
      background: #000;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      object-fit: cover;
      transform: scaleX(-1);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn.off { border-color: var(--danger); color: var(--danger); }
    .ctrl-btn.end { background: var(--danger); border-color: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <div class="app-frame">
    <div class="top-bar">
      <div class="brand">J.A.R.V.I.S.</div>
      <div class="status-pill">
        <div class="status-dot"></div>
        ONLINE
      </div>
    </div>

    <!-- MAIN HOME -->
    <div id="screen-main" class="screen active">
      <div class="core-viewport">
        <div class="jarvis-core-wrap" id="mainCore">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
        </div>

        <div class="subtitle-box" id="mainSubtitle">
          "At your service, Sir."
        </div>
      </div>

      <div class="actions-row">
        <div class="btn-card" onclick="openScreen('screen-chat')">
          <label>TERMINAL</label>
          <span>Text Console</span>
        </div>
        <div class="btn-card" onclick="startCall()">
          <label>TACTICAL</label>
          <span>Voice & Vision</span>
        </div>
      </div>
    </div>

    <!-- CHAT TERMINAL -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <button class="btn-back" onclick="openScreen('screen-main')">←</button>
        <span style="font-family: 'Orbitron'; font-size: 0.75rem; color: var(--cyan);">TERMINAL UPLINK</span>
      </div>

      <div class="chat-feed" id="chatFeed">
        <div class="msg bot">Good day, Sir. How may I assist you?</div>
      </div>

      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="Enter command..." onkeypress="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">SEND</button>
      </div>
    </div>

    <!-- TACTICAL MODE -->
    <div id="screen-call" class="screen">
      <div class="chat-header" style="justify-content: space-between;">
        <button class="btn-back" onclick="endCall()">←</button>
        <span style="font-family: 'Orbitron'; font-size: 0.75rem; color: var(--cyan);" id="callStatusText">TACTICAL UPLINK</span>
      </div>

      <div class="core-viewport">
        <div class="jarvis-core-wrap" id="callCore">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
        </div>
        <video id="userCamera" class="user-video-feed" autoplay playsinline muted></video>
        <div class="subtitle-box" id="callSubtitle">
          Listening for vocal prompt...
        </div>
      </div>

      <div class="call-controls">
        <button class="ctrl-btn" id="btnMic" onclick="toggleMic()">🎤</button>
        <button class="ctrl-btn" id="btnCam" onclick="toggleCam()">📹</button>
        <button class="ctrl-btn end" onclick="endCall()">✕</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://twin-proxy.tazabaevmaman07.workers.dev";
    
    let chatHistory = [];
    let isCallActive = false;
    let isProcessing = false;
    let mediaStream = null;
    let recognition = null;
    let isMicOn = true;
    let isCamOn = true;
    let isSpeaking = false; // tracks whether JARVIS's TTS is currently playing
    let lastSpokenReply = "";     // last thing JARVIS said, for echo detection
    let speakingCooldownUntil = 0; // timestamp (ms) until which incoming results are ignored
    const MIC_COOLDOWN_MS = 700;   // buffer after TTS ends before results are trusted again
    let systemVoices = [];

    // NEW: crude similarity check — normalizes and compares word overlap.
    // If the new transcript is basically what JARVIS just said, it's an echo, not a command.
    function isLikelyEcho(transcript) {
      if (!lastSpokenReply) return false;
      const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
      const a = norm(transcript);
      const b = norm(lastSpokenReply);
      if (!a) return false;
      if (b.includes(a) || a.includes(b)) return true;

      const wordsA = new Set(a.split(/\s+/).filter(Boolean));
      const wordsB = new Set(b.split(/\s+/).filter(Boolean));
      if (wordsA.size === 0) return false;
      let overlap = 0;
      wordsA.forEach(w => { if (wordsB.has(w)) overlap++; });
      return (overlap / wordsA.size) > 0.6;
    }

    // TTS VOICE INITIALIZATION
    function initSpeech() {
      if ('speechSynthesis' in window) {
        systemVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          systemVoices = window.speechSynthesis.getVoices();
        };
      }
    }
    initSpeech();

    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking === false) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    function openScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function openUniversalUrl(rawTarget) {
      if (!rawTarget) return;
      let target = rawTarget.trim().replace(/\/+$/, '');

      if (target.startsWith('@')) {
        window.open(`https://www.youtube.com/${target}`, '_blank');
        return;
      }

      if (/^https?:\/\//i.test(target)) {
        window.open(target, '_blank');
        return;
      }

      if (!target.includes('.') && !target.includes(' ')) {
        window.open(`https://www.${target}.com`, '_blank');
        return;
      }

      window.open(`https://${target}`, '_blank');
    }

    // ACTION TAG PARSER & CLEANER
    function processAndCleanReply(text) {
      let cleaned = text;

      // 1. Open video in a NEW Chrome tab
      const videoIdMatch = cleaned.match(/\[\[PLAY_VIDEO_ID:\s*([a-zA-Z0-9_-]{11})\]\]/i);
      if (videoIdMatch) {
        window.open(`https://www.youtube.com/watch?v=${videoIdMatch[1]}`, '_blank');
      }

      // 2. Open standard web page or search query
      const navMatch = cleaned.match(/\[\[NAVIGATE:\s*(.*?)\]\]/i);
      if (navMatch && !videoIdMatch) {
        openUniversalUrl(navMatch[1].trim());
      }

      // 3. Clean ALL bracketed tags so no code ever leaks into the chat bubble
      cleaned = cleaned.replace(/\[\[.*?\]\]/gi, '');

      return cleaned.trim();
    }

    // UPDATED: no longer stops/starts recognition around TTS (that caused a race
    // where start() could throw silently while the prior stop() was still completing).
    // Instead, recognition just keeps running continuously and results are ignored
    // while isSpeaking / within the cooldown window / matching the echo check.
    function speakJARVIS(text, coreElement) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      isSpeaking = true;
      lastSpokenReply = text;

      const utterance = new SpeechSynthesisUtterance(text);
      const voices = systemVoices.length ? systemVoices : window.speechSynthesis.getVoices();
      const britishVoice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('George'))) 
                        || voices.find(v => v.lang === 'en-GB')
                        || voices.find(v => v.lang.includes('en'));

      if (britishVoice) utterance.voice = britishVoice;
      utterance.rate = 1.0;
      utterance.pitch = 0.95;

      if (coreElement) coreElement.classList.add('speaking');

      utterance.onend = () => {
        if (coreElement) coreElement.classList.remove('speaking');
        isProcessing = false;
        isSpeaking = false;
        speakingCooldownUntil = Date.now() + MIC_COOLDOWN_MS;
      };

      utterance.onerror = () => {
        if (coreElement) coreElement.classList.remove('speaking');
        isProcessing = false;
        isSpeaking = false;
        speakingCooldownUntil = Date.now() + MIC_COOLDOWN_MS;
      };

      window.speechSynthesis.speak(utterance);
    }

    async function requestAI(userPrompt, imageBase64 = null) {
      chatHistory.push({ role: "user", content: userPrompt });

      try {
        const recentMessages = chatHistory.slice(-4);
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: recentMessages, image: imageBase64 })
        });

        const data = await response.json();
        const reply = data.reply || "At your service, Sir.";
        chatHistory.push({ role: "assistant", content: reply });
        return reply;
      } catch (err) {
        console.error(err);
        isProcessing = false;
        return "An anomaly occurred while processing your request, Sir.";
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || isProcessing) return;

      isProcessing = true;
      input.value = '';
      appendChatMessage(text, 'user');

      const mainCore = document.getElementById('mainCore');
      mainCore.classList.add('speaking');

      const rawReply = await requestAI(text);
      const cleanReply = processAndCleanReply(rawReply);

      appendChatMessage(cleanReply, 'bot');
      document.getElementById('mainSubtitle').textContent = `"${cleanReply}"`;
      speakJARVIS(cleanReply, mainCore);
    }

    function appendChatMessage(text, sender) {
      const feed = document.getElementById('chatFeed');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      feed.appendChild(msg);
      feed.scrollTop = feed.scrollHeight;
    }

    function captureCameraSnapshot() {
      const video = document.getElementById('userCamera');
      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return null;

      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 120;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.35);
    }

    async function startCall() {
      isCallActive = true;
      openScreen('screen-call');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } 
        });
        document.getElementById('userCamera').srcObject = mediaStream;
      } catch (e) {
        document.getElementById('callStatusText').textContent = "AUDIO_ONLY";
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = async (event) => {
          if (!isCallActive || isProcessing || isSpeaking || Date.now() < speakingCooldownUntil) return;

          const transcript = event.results[event.results.length - 1][0].transcript.trim();

          if (transcript.length < 3) return;

          // if this looks like JARVIS hearing its own last reply, ignore it
          if (isLikelyEcho(transcript)) {
            console.log('Ignored likely echo:', transcript);
            return;
          }

          isProcessing = true;
          document.getElementById('callSubtitle').textContent = `USR: "${transcript}"`;

          const callCore = document.getElementById('callCore');
          const snapshot = captureCameraSnapshot();

          const rawReply = await requestAI(transcript, snapshot);
          const cleanReply = processAndCleanReply(rawReply);
          
          document.getElementById('callSubtitle').textContent = `JARVIS: "${cleanReply}"`;
          speakJARVIS(cleanReply, callCore);
        };

        recognition.onend = () => {
          // With continuous mode, this normally only fires on an unexpected
          // stop (browser silence timeout, network hiccup) since we no longer
          // call recognition.stop() ourselves during TTS playback.
          if (isCallActive && isMicOn && recognition) {
            try { recognition.start(); } catch(e){}
          }
        };

        try { recognition.start(); } catch(e){}
      }
    }

    function toggleMic() {
      if (mediaStream) {
        isMicOn = !isMicOn;
        mediaStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('btnMic').classList.toggle('off', !isMicOn);
        if (recognition) {
          if (isMicOn) { try { recognition.start(); } catch(e){} } else { recognition.stop(); }
        }
      }
    }

    function toggleCam() {
      if (mediaStream) {
        isCamOn = !isCamOn;
        mediaStream.getVideoTracks()[0].enabled = isCamOn;
        document.getElementById('btnCam').classList.toggle('off', !isCamOn);
        document.getElementById('userCamera').style.display = isCamOn ? 'block' : 'none';
      }
    }

    function endCall() {
      isCallActive = false;
      isProcessing = false;
      isSpeaking = false;
      speakingCooldownUntil = 0;
      lastSpokenReply = "";
      if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      openScreen('screen-main');
    }
  </script>
</body>
</html>
