<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twin - Your Realistic AI Companion</title>
  <style>
    :root {
      --bg-color: #09090b;
      --surface-color: #18181b;
      --primary: #ffffff;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .app-frame {
      width: 100%;
      max-width: 400px;
      height: 800px;
      background-color: var(--bg-color);
      border-radius: 40px;
      border: 8px solid #1f1f22;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 30px 20px;
      animation: fadeIn 0.4s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 { margin-bottom: 10px; font-weight: 600; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }

    input, textarea {
      width: 100%;
      background: var(--surface-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    button.btn-primary {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: auto;
      transition: opacity 0.2s;
    }

    button.btn-primary:hover { opacity: 0.9; }

    /* Chat UI */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .chat-header .actions button {
      background: var(--surface-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.2s;
    }

    .chat-header .actions button:hover {
      background: var(--border);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-right: 5px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg.bot {
      background: var(--surface-color);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-input input {
      margin-bottom: 0;
      flex: 1;
    }
    
    .chat-input button {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .chat-input button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- Chat Screen -->
    <div class="screen active" id="chatScreen">
      
      <div class="chat-header">
        <h2>Twin AI</h2>
        <div class="actions">
          <button id="micButton" title="Microphone">🎤</button>
          <button id="camButton" title="Camera">📹</button>
        </div>
      </div>

      <div class="chat-area" id="chatBox">
        <div class="msg bot">Hi! I'm your Twin. I'm ready to chat.</div>
      </div>

      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendButton">Send</button>
      </div>

    </div>
  </div>

  <script>
    // --- 1. MEDIA PERMISSIONS (MIC & CAMERA) ---
    async function requestMediaPermissions(type) {
      try {
        const constraints = {
          video: type === 'camera',
          audio: true 
        };
        
        // This triggers the browser permission popup
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log(`Success! ${type} access granted.`);
        alert(`${type === 'camera' ? 'Camera' : 'Microphone'} access granted! (Ready to attach to a video element)`);
        
      } catch (error) {
        console.error("Error accessing media devices:", error);
        if (error.name === 'NotAllowedError') {
          alert("Please allow camera and microphone access in your browser settings to use this feature.");
        } else {
          alert("Could not find a camera or microphone on this device.");
        }
      }
    }

    document.getElementById('micButton').addEventListener('click', () => requestMediaPermissions('mic'));
    document.getElementById('camButton').addEventListener('click', () => requestMediaPermissions('camera'));


    // --- 2. CHAT FUNCTIONALITY ---
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('msg', sender);
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      
      // Auto-scroll to the bottom
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const text = messageInput.value.trim();
      if (!text) return;

      // 1. Add User Message
      addMessage(text, 'user');
      messageInput.value = '';

      // 2. Fetch AI Response (Placeholder for your API Call)
      // To fix the "repeating text" issue, this is where you would send 'text' to OpenAI/Gemini.
      setTimeout(() => {
        // Mock response to demonstrate UI working
        addMessage(`I heard you say: "${text}". Connect me to an API to have a real conversation!`, 'bot');
      }, 800);
    }

    sendButton.addEventListener('click', handleSend);

    // Allow pressing "Enter" to send
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });
  </script>

</body>
</html>
