### 1. Fixing the Repeated Text & Language Mirroring

Right now, your code is likely firing a hardcoded, default response every time you hit "send" instead of actually processing what you typed. 

To make the Twin smart and have it match the user's language, you need to send the user's message to an AI backend (like the OpenAI API, Gemini API, or Claude) and include a **System Prompt**. 

If you are using an API, you just need to add an instruction like this to the system setup:
> *"You are a friendly virtual twin. You must detect the language of the user's input and reply exclusively in that exact same language. Do not use canned responses; have a real conversation."*

When you send the user's input to the AI with that rule, it will automatically switch between English, Russian, Uzbek, or whatever else the user types, and it will actually answer your questions instead of repeating itself!

### 2. Asking Chrome for Microphone and Camera Permissions

To get that popup in Chrome asking the user to allow their mic and camera (perfect for those two buttons in the top right of your UI), you need to use the browser's built-in `navigator.mediaDevices.getUserMedia` API. 

Here is the JavaScript code you can link to your video/mic buttons:

```javascript
// Function to request Camera and Microphone
async function requestMediaPermissions() {
    try {
        // This line triggers the Chrome permission popup!
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: true 
        });
        
        console.log("Success! Camera and Microphone access granted.");
        
        // TODO: You can now take 'stream' and attach it to an HTML <video> element
        // document.getElementById('myVideo').srcObject = stream;

    } catch (error) {
        console.error("Error accessing media devices:", error);
        
        // If the user clicks "Block" or doesn't have a mic/cam
        if (error.name === 'NotAllowedError') {
            alert("Please allow camera and microphone access in your browser settings to use this feature.");
        } else {
            alert("Could not find a camera or microphone.");
        }
    }
}
