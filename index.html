<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #03070d;
      --panel: rgba(8, 16, 28, 0.6);
      --panel-border: rgba(0, 243, 255, 0.12);
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.35);
      --text: #e0f7fc;
      --text-muted: #5c7f93;
      --danger: #ff3355;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: #000;
      background-image: radial-gradient(circle at 50% 30%, #081a2e 0%, #020509 80%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background: var(--bg);
      border-radius: 36px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.08), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 24px 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.06);
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .status-pill {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--cyan);
      background: rgba(0, 243, 255, 0.06);
      border: 1px solid rgba(0, 243, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s infinite alternate;
    }

    @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      overflow: hidden;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .core-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .jarvis-core-wrap {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border-top-color: var(--cyan);
      border-bottom-color: rgba(0, 243, 255, 0.15);
      border-left-color: rgba(0, 243, 255, 0.15);
      border-right-color: var(--cyan);
      animation: rotateRing 12s linear infinite;
    }

    .ring-mid {
      width: 70%;
      height: 70%;
      border: 1px dashed rgba(0, 243, 255, 0.4);
      animation: rotateRingRev 8s linear infinite;
    }

    .ring-inner {
      width: 40%;
      height: 40%;
      background: radial-gradient(circle, var(--cyan) 0%, rgba(0, 243, 255, 0.1) 70%);
      border-radius: 50%;
      box-shadow: 0 0 25px var(--cyan-glow);
      transition: transform 0.2s ease;
    }

    .jarvis-core-wrap.speaking .ring-inner {
      transform: scale(1.35);
      box-shadow: 0 0 45px var(--cyan), inset 0 0 15px #fff;
    }

    @keyframes rotateRing { 100% { transform: rotate(360deg); } }
    @keyframes rotateRingRev { 100% { transform: rotate(-360deg); } }

    /* Media HUD Component */
    .media-hud {
      width: 100%;
      height: 140px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      margin-top: 15px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .media-hud.active { display: flex; }

    #mediaPlayer {
      width: 100%;
      height: 100%;
      border: none;
    }

    .subtitle-box {
      margin-top: 15px;
      width: 100%;
      min-height: 50px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .btn-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-card label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: var(--cyan);
      cursor: pointer;
    }

    .btn-card span { font-size: 0.7rem; color: var(--text-muted); }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-back {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--cyan);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .msg.bot {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      align-self: flex-start;
    }

    .msg.user {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.25);
      color: var(--cyan);
      align-self: flex-end;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 6px 6px 6px 16px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.85rem;
    }

    .input-bar button {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
    }

    .user-video-feed {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 90px;
      height: 120px;
      background: #000;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      object-fit: cover;
      transform: scaleX(-1);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn.off { border-color: var(--danger); color: var(--danger); }
    .ctrl-btn.end { background: var(--danger); border-color: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <div class="app-frame">
    <div class="top-bar">
      <div class="brand">J.A.R.V.I.S.</div>
      <div class="status-pill">
        <div class="status-dot"></div>
        ONLINE
      </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="screen-main" class="screen active">
      <div class="core-viewport">
        <div class="jarvis-core-wrap" id="mainCore">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
        </div>

        <!-- Embedded Media HUD for direct playback & control -->
        <div class="media-hud" id="mediaHud">
          <div id="mediaPlayer"></div>
        </div>

        <div class="subtitle-box" id="mainSubtitle">
          "System ready, Sir. Media playback and classroom navigation loaded."
        </div>
      </div>

      <div class="actions-row">
        <div class="btn-card" onclick="openScreen('screen-chat')">
          <label>TERMINAL</label>
          <span>Text Console</span>
        </div>
        <div class="btn-card" onclick="startCall()">
          <label>TACTICAL</label>
          <span>Voice & Vision</span>
        </div>
      </div>
    </div>

    <!-- CHAT TERMINAL -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <button class="btn-back" onclick="openScreen('screen-main')">←</button>
        <span style="font-family: 'Orbitron'; font-size: 0.75rem; color: var(--cyan);">TERMINAL UPLINK</span>
      </div>

      <div class="chat-feed" id="chatFeed">
        <div class="msg bot">Good day, Sir. How may I assist you?</div>
      </div>

      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="Enter command..." onkeypress="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">SEND</button>
      </div>
    </div>

    <!-- TACTICAL MODE -->
    <div id="screen-call" class="screen">
      <div class="chat-header" style="justify-content: space-between;">
        <button class="btn-back" onclick="endCall()">←</button>
        <span style="font-family: 'Orbitron'; font-size: 0.75rem; color: var(--cyan);" id="callStatusText">TACTICAL UPLINK</span>
      </div>

      <div class="core-viewport">
        <div class="jarvis-core-wrap" id="callCore">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
        </div>
        <video id="userCamera" class="user-video-feed" autoplay playsinline muted></video>
        <div class="subtitle-box" id="callSubtitle">
          Listening for vocal prompt...
        </div>
      </div>

      <div class="call-controls">
        <button class="ctrl-btn" id="btnMic" onclick="toggleMic()">🎤</button>
        <button class="ctrl-btn" id="btnCam" onclick="toggleCam()">📹</button>
        <button class="ctrl-btn end" onclick="endCall()">✕</button>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const WORKER_URL = "https://twin-proxy.tazabaevmaman07.workers.dev";
    
    // Class Mapping Configuration (Update these URLs to your specific class links)
    const CLASSROOM_ROUTES = {
      "math": "https://classroom.google.com/u/0/c/MjcxOTM4",
      "physics": "https://classroom.google.com/u/0/c/Mzg0OTI1",
      "english": "https://classroom.google.com/u/0/c/NDk1ODE1",
      "general": "https://classroom.google.com"
    };

    let ytPlayer = null;
    let chatHistory = [];
    let isCallActive = false;
    let isProcessing = false;
    let mediaStream = null;
    let recognition = null;
    let isMicOn = true;
    let isCamOn = true;
    let systemVoices = [];

    function onYouTubeIframeAPIReady() {
      console.log("YouTube API Ready.");
    }

    function initSpeech() {
      if ('speechSynthesis' in window) {
        systemVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          systemVoices = window.speechSynthesis.getVoices();
        };
      }
    }
    initSpeech();

    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking === false) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    function openScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // Advanced Command Parser (Media, Volume, Quality, Deep Navigation)
    function executeJarvisCommands(text) {
      let cleaned = text;

      // 1. DIRECT MEDIA PLAYBACK COMMAND
      const playMatch = text.match(/\[\[PLAY_MEDIA:\s*(.*?)\]\]/i);
      if (playMatch) {
        const query = playMatch[1].trim();
        playMediaTrack(query);
        cleaned = cleaned.replace(/\[\[PLAY_MEDIA:.*?\]\]/gi, '');
      }

      // 2. VOLUME CONTROL COMMAND
      const volMatch = text.match(/\[\[SET_VOLUME:\s*(\d+)\]\]/i);
      if (volMatch) {
        const volumeLevel = parseInt(volMatch[1], 10);
        if (ytPlayer && ytPlayer.setVolume) {
          ytPlayer.setVolume(volumeLevel);
        }
        cleaned = cleaned.replace(/\[\[SET_VOLUME:.*?\]\]/gi, '');
      }

      // 3. QUALITY CONTROL COMMAND
      const qualityMatch = text.match(/\[\[SET_QUALITY:\s*(.*?)\]\]/i);
      if (qualityMatch) {
        const quality = qualityMatch[1].trim();
        if (ytPlayer && ytPlayer.setPlaybackQuality) {
          ytPlayer.setPlaybackQuality(quality);
        }
        cleaned = cleaned.replace(/\[\[SET_QUALITY:.*?\]\]/gi, '');
      }

      // 4. MEDIA PAUSE / PLAY
      const ctrlMatch = text.match(/\[\[MEDIA_CONTROL:\s*(.*?)\]\]/i);
      if (ctrlMatch) {
        const action = ctrlMatch[1].trim().toLowerCase();
        if (ytPlayer) {
          if (action === 'pause') ytPlayer.pauseVideo();
          if (action === 'play') ytPlayer.playVideo();
        }
        cleaned = cleaned.replace(/\[\[MEDIA_CONTROL:.*?\]\]/gi, '');
      }

      // 5. DEEP NAVIGATION & CLASSROOM ROUTING
      const navMatch = text.match(/\[\[NAVIGATE:\s*(.*?)\]\]/i);
      if (navMatch) {
        const target = navMatch[1].trim().toLowerCase();
        
        if (target.includes("classroom")) {
          let opened = false;
          for (const [className, url] of Object.entries(CLASSROOM_ROUTES)) {
            if (target.includes(className)) {
              window.open(url, '_blank');
              opened = true;
              break;
            }
          }
          if (!opened) window.open(CLASSROOM_ROUTES["general"], '_blank');
        } else {
          window.open(target.startsWith('http') ? target : `https://${target}`, '_blank');
        }
        cleaned = cleaned.replace(/\[\[NAVIGATE:.*?\]\]/gi, '');
      }

      return cleaned.trim();
    }

    // Play YouTube video programmatically inside the HUD
    function playMediaTrack(query) {
      const mediaHud = document.getElementById('mediaHud');
      mediaHud.classList.add('active');

      // Uses YouTube Embed search parameter for direct autoplay
      const embedUrl = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1&enablejsapi=1`;
      
      document.getElementById('mediaPlayer').innerHTML = `<iframe id="ytIframe" width="100%" height="100%" src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;

      setTimeout(() => {
        if (window.YT && window.YT.Player) {
          ytPlayer = new YT.Player('ytIframe');
        }
      }, 1000);
    }

    function speakJARVIS(text, coreElement) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const cleanText = executeJarvisCommands(text);

      const utterance = new SpeechSynthesisUtterance(cleanText);
      const voices = systemVoices.length ? systemVoices : window.speechSynthesis.getVoices();
      const britishVoice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('George'))) 
                        || voices.find(v => v.lang === 'en-GB')
                        || voices.find(v => v.lang.includes('en'));

      if (britishVoice) utterance.voice = britishVoice;
      utterance.rate = 1.0;
      utterance.pitch = 0.95;

      if (coreElement) coreElement.classList.add('speaking');

      utterance.onend = () => {
        if (coreElement) coreElement.classList.remove('speaking');
        isProcessing = false;
      };

      utterance.onerror = () => {
        if (coreElement) coreElement.classList.remove('speaking');
        isProcessing = false;
      };

      window.speechSynthesis.speak(utterance);
    }

    async function requestAI(userPrompt, imageBase64 = null) {
      chatHistory.push({ role: "user", content: userPrompt });

      try {
        const recentMessages = chatHistory.slice(-4);
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: recentMessages, image: imageBase64 })
        });

        const data = await response.json();
        const reply = data.reply || "At your service, Sir.";
        chatHistory.push({ role: "assistant", content: reply });
        return reply;
      } catch (err) {
        console.error(err);
        isProcessing = false;
        return "An anomaly occurred while processing your request, Sir.";
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || isProcessing) return;

      isProcessing = true;
      input.value = '';
      appendChatMessage(text, 'user');

      const mainCore = document.getElementById('mainCore');
      mainCore.classList.add('speaking');

      const reply = await requestAI(text);
      appendChatMessage(reply, 'bot');
      document.getElementById('mainSubtitle').textContent = `"${reply}"`;
      speakJARVIS(reply, mainCore);
    }

    function appendChatMessage(text, sender) {
      const feed = document.getElementById('chatFeed');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      feed.appendChild(msg);
      feed.scrollTop = feed.scrollHeight;
    }

    function captureCameraSnapshot() {
      const video = document.getElementById('userCamera');
      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return null;

      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 120;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.35);
    }

    async function startCall() {
      isCallActive = true;
      openScreen('screen-call');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
        });
        document.getElementById('userCamera').srcObject = mediaStream;
      } catch (e) {
        document.getElementById('callStatusText').textContent = "AUDIO_ONLY";
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = async (event) => {
          if (!isCallActive || isProcessing) return;

          const transcript = event.results[event.results.length - 1][0].transcript.trim();
          if (transcript.length < 3) return;

          isProcessing = true;
          document.getElementById('callSubtitle').textContent = `USR: "${transcript}"`;

          const callCore = document.getElementById('callCore');
          const snapshot = captureCameraSnapshot();

          const reply = await requestAI(transcript, snapshot);
          
          document.getElementById('callSubtitle').textContent = `JARVIS: "${reply}"`;
          speakJARVIS(reply, callCore);
        };

        recognition.onend = () => {
          if (isCallActive && isMicOn && recognition) {
            try { recognition.start(); } catch(e){}
          }
        };

        try { recognition.start(); } catch(e){}
      }
    }

    function toggleMic() {
      if (mediaStream) {
        isMicOn = !isMicOn;
        mediaStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('btnMic').classList.toggle('off', !isMicOn);
        if (recognition) {
          if (isMicOn) { try { recognition.start(); } catch(e){} } else { recognition.stop(); }
        }
      }
    }

    function toggleCam() {
      if (mediaStream) {
        isCamOn = !isCamOn;
        mediaStream.getVideoTracks()[0].enabled = isCamOn;
        document.getElementById('btnCam').classList.toggle('off', !isCamOn);
        document.getElementById('userCamera').style.display = isCamOn ? 'block' : 'none';
      }
    }

    function endCall() {
      isCallActive = false;
      isProcessing = false;
      if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      openScreen('screen-main');
    }
  </script>
</body>
</html>
